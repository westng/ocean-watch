name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'westng/ocean-watch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.resolve_release_tag.outputs.release_tag }}
      release_notes: ${{ steps.release_notes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Resolve release tag from project version
        id: resolve_release_tag
        shell: bash
        run: |
          release_tag="$(python scripts/release.py tag | python -c 'import json, sys; print(json.load(sys.stdin)["tag"])')"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
      - name: Verify branch, tag, version, and changelog
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.resolve_release_tag.outputs.release_tag }}"
          python scripts/release.py check --tag "${RELEASE_TAG}"
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from the main branch." >&2
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The selected commit is not the current origin/main commit." >&2
            exit 1
          fi
          if existing_tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null)"; then
            if [[ "${existing_tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "The release tag already points to a different commit." >&2
              exit 1
            fi
          fi
      - name: Generate release notes from Changelog
        id: release_notes
        env:
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
        shell: bash
        run: |
          python scripts/release.py notes --tag "${RELEASE_TAG}" --output release-notes/RELEASE_NOTES.md
          echo "release_notes=$(base64 -w 0 release-notes/RELEASE_NOTES.md)" >> "${GITHUB_OUTPUT}"
      - name: Run release quality gate
        run: |
          python -m compileall -q skills/ads-plan-monitor/src/ocean_watch scripts
          ruff check skills/ads-plan-monitor/src scripts tests
          bandit -q --severity-level medium -r skills/ads-plan-monitor/src/ocean_watch scripts
          python -m unittest discover -s tests
  publish:
    if: github.repository == 'westng/ocean-watch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      RELEASE_NOTES: ${{ needs.validate.outputs.release_notes }}
    steps:
      - name: Restore validated release notes
        shell: bash
        run: |
          mkdir -p release-notes
          printf '%s' "${RELEASE_NOTES}" | base64 --decode > release-notes/RELEASE_NOTES.md
      - name: Publish GitHub Release without custom assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Ocean Watch ${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Ocean Watch ${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
          fi
