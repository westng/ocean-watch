name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'westng/ocean-watch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install release toolchain
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify tag and version contract
        run: |
          python scripts/release.py check --tag "${RELEASE_TAG}"
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from the main branch." >&2
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The selected commit is not the current origin/main commit." >&2
            exit 1
          fi
          if existing_tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null)"; then
            if [[ "${existing_tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "The release tag already points to a different commit." >&2
              exit 1
            fi
          fi
      - name: Generate release notes from Changelog
        run: python scripts/release.py notes --tag "${RELEASE_TAG}" --output release-notes/RELEASE_NOTES.md
      - name: Run release quality gate
        run: |
          python -m compileall -q skills/ads-plan-monitor/src/ocean_watch scripts
          ruff check skills/ads-plan-monitor/src scripts tests
          bandit -q --severity-level medium -r skills/ads-plan-monitor/src/ocean_watch scripts
          python -m unittest discover -s tests
      - name: Build CLI distributions
        run: python -m build
      - name: Build offline Codex Plugin
        run: python scripts/release.py plugin --output-dir dist
      - name: Verify wheel in isolation
        run: |
          python -m venv "${RUNNER_TEMP}/release-venv"
          "${RUNNER_TEMP}/release-venv/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          CODEX_HOME="${RUNNER_TEMP}/codex-home" "${RUNNER_TEMP}/release-venv/bin/ocean-watch" setup init --home-config
      - name: Generate and verify checksums
        run: |
          python scripts/release.py checksums --directory dist
          python scripts/release.py verify-checksums --file dist/SHA256SUMS
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ocean-watch-${{ inputs.release_tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: ocean-watch-${{ inputs.release_tag }}-notes
          path: release-notes/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

  publish:
    if: github.repository == 'westng/ocean-watch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: ocean-watch-${{ inputs.release_tag }}
          path: dist
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: ocean-watch-${{ inputs.release_tag }}-notes
          path: release-notes
      - name: Recheck artifact integrity
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "Ocean Watch ${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "Ocean Watch ${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
          fi
