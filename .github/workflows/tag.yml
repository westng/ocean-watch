name: Publish Tag

on:
  workflow_dispatch:

concurrency:
  group: publish-tag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'westng/ocean-watch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version_tag: ${{ steps.resolve_version_tag.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Resolve version tag from project version
        id: resolve_version_tag
        shell: bash
        run: |
          version_tag="$(python scripts/version_tag.py tag | python -c 'import json, sys; print(json.load(sys.stdin)["tag"])')"
          echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"
      - name: Verify branch, tag, version, and changelog
        shell: bash
        run: |
          VERSION_TAG="${{ steps.resolve_version_tag.outputs.version_tag }}"
          python scripts/version_tag.py check --tag "${VERSION_TAG}"
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Version tags must be dispatched from the main branch." >&2
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The selected commit is not the current origin/main commit." >&2
            exit 1
          fi
          if existing_tag_commit="$(git rev-parse "refs/tags/${VERSION_TAG}^{commit}" 2>/dev/null)"; then
            if [[ "${existing_tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "The version tag already points to a different commit." >&2
              exit 1
            fi
          fi
      - name: Run tag quality gate
        run: |
          python -m compileall -q skills/ads-plan-monitor/src/ocean_watch scripts
          ruff check skills/ads-plan-monitor/src scripts tests
          bandit -q --severity-level medium -r skills/ads-plan-monitor/src/ocean_watch scripts
          python -m unittest discover -s tests
  publish:
    if: github.repository == 'westng/ocean-watch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ needs.validate.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish version tag
        shell: bash
        run: |
          if existing_tag_commit="$(git rev-parse "refs/tags/${VERSION_TAG}^{commit}" 2>/dev/null)"; then
            if [[ "${existing_tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "The version tag already points to a different commit." >&2
              exit 1
            fi
            echo "${VERSION_TAG} already points to ${GITHUB_SHA}; nothing to publish."
            exit 0
          fi
          git tag "${VERSION_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${VERSION_TAG}"
