name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'westng/ocean-watch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/V3')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: runtime/ocean-watch-go/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "f2==0.0.1.7" "socksio>=1,<2" PyYAML
      - name: Verify current release branch revision
        shell: bash
        run: |
          if [[ "$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")" != "${GITHUB_SHA}" ]]; then
            echo "Release must use the current remote branch commit." >&2
            exit 1
          fi
      - name: Validate prepared release
        id: release
        shell: bash
        run: |
          latest_tag="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'map(select(.draft == false and .prerelease == false))[0].tag_name // ""')"
          python scripts/version_tag.py release-check \
            --latest-tag "${latest_tag}" \
            > "${RUNNER_TEMP}/release.json"
          version_tag="$(python -c 'import json,sys; print(json.load(sys.stdin)["tag"])' \
            < "${RUNNER_TEMP}/release.json")"
          echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"
          prerelease="$(python -c 'import json,sys; print(str(json.load(sys.stdin)["prerelease"]).lower())' < "${RUNNER_TEMP}/release.json")"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_NAME}" != main && "${prerelease}" != true ]]; then
            echo "Stable releases must use main." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" > "${RUNNER_TEMP}/ci-run.json"
          run_id="$(python - "${RUNNER_TEMP}/ci-run.json" "${GITHUB_SHA}" <<'PY'
          import json, sys
          runs = json.load(open(sys.argv[1]))["workflow_runs"]
          if not runs or runs[0]["head_sha"] != sys.argv[2] or runs[0]["status"] != "completed" or runs[0]["conclusion"] != "success":
              raise SystemExit("The latest CI run for this exact commit has not succeeded.")
          print(runs[0]["id"])
          PY
          )"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" --paginate --slurp \
            --jq '[.[].jobs[] | {name, conclusion, head_sha}]' > "${RUNNER_TEMP}/checks.json"
          python - "${RUNNER_TEMP}/checks.json" "${GITHUB_SHA}" <<'PY'
          import json, sys
          checks = json.loads(open(sys.argv[1]).read())
          required = {"Go / ubuntu-latest", "Go / macos-latest", "Go / windows-latest", "F2 / Python 3.10", "F2 / Python 3.12", "Harness package / ubuntu-latest", "Harness package / macos-latest", "Harness package / windows-latest", "Plugin contracts"}
          passed = {c["name"] for c in checks if c["head_sha"] == sys.argv[2] and c["conclusion"] == "success"}
          if required - passed:
              raise SystemExit("Missing successful CI checks: " + ", ".join(sorted(required - passed)))
          PY
      - name: Run release quality checks
        shell: bash
        run: |
          go -C runtime/ocean-watch-go test ./...
          go -C runtime/ocean-watch-go vet ./...
          go -C runtime/ocean-watch-go run ./cmd/build-runtime --all --verify
          python -m unittest discover -s f2 -p "test_resolve.py" -v
          python scripts/validate_distribution.py
          skills/ads-plan-monitor/run --version
          skills/qc-plan-monitor/run --help
      - name: Generate release notes
        shell: bash
        env:
          VERSION_TAG: ${{ steps.release.outputs.version_tag }}
        run: python scripts/version_tag.py notes --tag "${VERSION_TAG}" --out "${RUNNER_TEMP}/release-notes.md"
      - name: Verify immutable release source
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Release validation modified the checked-out source." >&2
            exit 1
          fi
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "Release branch advanced while this release was running." >&2
            exit 1
          fi
      - name: Publish immutable version Tag
        shell: bash
        env:
          VERSION_TAG: ${{ steps.release.outputs.version_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if ! remote_refs="$(git ls-remote --tags origin \
            "refs/tags/${VERSION_TAG}" "refs/tags/${VERSION_TAG}^{}")"; then
            echo "Unable to determine the remote Tag state." >&2
            exit 1
          fi
          if [[ -z "${remote_refs}" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${VERSION_TAG}" -f "sha=${RELEASE_SHA}" >/dev/null
          else
            remote_sha="$(awk '
              NR == 1 { direct = $1 }
              $2 ~ /\^\{\}$/ { peeled = $1 }
              END { print peeled != "" ? peeled : direct }
            ' <<< "${remote_refs}")"
            if [[ "${remote_sha}" != "${RELEASE_SHA}" ]]; then
              echo "Existing Tag ${VERSION_TAG} points to ${remote_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          fi
          git fetch --force origin "refs/tags/${VERSION_TAG}:refs/tags/${VERSION_TAG}"
          [[ "$(git rev-parse "refs/tags/${VERSION_TAG}^{commit}")" == "${RELEASE_SHA}" ]]
      - name: Create or verify immutable GitHub Release
        shell: bash
        env:
          VERSION_TAG: ${{ steps.release.outputs.version_tag }}
          RELEASE_SHA: ${{ github.sha }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if ! gh release view "${VERSION_TAG}" --json tagName,name,isDraft,isPrerelease,body > "${RUNNER_TEMP}/release-metadata.json"; then
            flags=()
            if [[ "${IS_PRERELEASE}" == true ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "${VERSION_TAG}" --verify-tag --target "${RELEASE_SHA}" \
              --title "${VERSION_TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md" "${flags[@]}"
          fi
          gh release view "${VERSION_TAG}" --json tagName,name,isDraft,isPrerelease,body > "${RUNNER_TEMP}/release-metadata.json"
          python - "${RUNNER_TEMP}/release-metadata.json" "${RUNNER_TEMP}/release-notes.md" "${VERSION_TAG}" "${IS_PRERELEASE}" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_notes = Path(sys.argv[2]).read_text(encoding="utf-8").rstrip()
          version_tag = sys.argv[3]
          if metadata.get("tagName") != version_tag or metadata.get("name") != version_tag:
              raise SystemExit("Existing Release identity does not match the version Tag.")
          if metadata.get("isDraft") or metadata.get("isPrerelease") != (sys.argv[4] == "true"):
              raise SystemExit("Existing Release draft/prerelease state does not match the candidate.")
          if str(metadata.get("body") or "").rstrip() != expected_notes:
              raise SystemExit("Existing Release notes do not match CHANGELOG.md.")
          PY
