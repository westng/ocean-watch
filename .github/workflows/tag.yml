name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'westng/ocean-watch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify current main revision
        shell: bash
        run: |
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "Release must use the current origin/main commit." >&2
            exit 1
          fi
      - name: Validate prepared release
        id: release
        shell: bash
        run: |
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          python scripts/version_tag.py release-check \
            --latest-tag "${latest_tag}" \
            > "${RUNNER_TEMP}/release-candidate.json"
          version_tag="$(python -c 'import json, sys; print(json.load(sys.stdin)["tag"])' \
            < "${RUNNER_TEMP}/release-candidate.json")"
          echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"
      - name: Run release quality gate
        run: |
          python -m compileall -q skills/ads-plan-monitor/src/ocean_watch scripts
          ruff check skills/ads-plan-monitor/src scripts tests
          bandit -q --severity-level medium -r skills/ads-plan-monitor/src/ocean_watch scripts
          python -m unittest discover -s tests -v
      - name: Generate release notes
        shell: bash
        env:
          VERSION_TAG: ${{ steps.release.outputs.version_tag }}
        run: |
          python scripts/version_tag.py notes \
            --tag "${VERSION_TAG}" \
            --out "${RUNNER_TEMP}/release-notes.md"
      - name: Verify immutable release source
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Release validation modified the checked-out source." >&2
            exit 1
          fi
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "origin/main advanced while this release was running." >&2
            exit 1
          fi
      - name: Publish immutable version Tag
        shell: bash
        env:
          VERSION_TAG: ${{ steps.release.outputs.version_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION_TAG}" > /dev/null
          remote_status=$?
          set -e
          case "${remote_status}" in
            0)
              ;;
            2)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/tags/${VERSION_TAG}" \
                -f "sha=${RELEASE_SHA}" \
                > /dev/null
              ;;
            *)
              echo "Unable to determine the remote Tag state." >&2
              exit "${remote_status}"
              ;;
          esac
          git fetch --force origin "refs/tags/${VERSION_TAG}:refs/tags/${VERSION_TAG}"
          if [[ "$(git rev-parse "refs/tags/${VERSION_TAG}^{commit}")" != "${RELEASE_SHA}" ]]; then
            echo "The published Tag points to a different commit." >&2
            exit 1
          fi
      - name: Create or verify immutable GitHub Release
        shell: bash
        env:
          VERSION_TAG: ${{ steps.release.outputs.version_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "${VERSION_TAG}" \
            --json tagName,name,isDraft,isPrerelease,body \
            > "${RUNNER_TEMP}/release-metadata.json"; then
            gh release create "${VERSION_TAG}" \
              --verify-tag \
              --target "${RELEASE_SHA}" \
              --title "${VERSION_TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
          gh release view "${VERSION_TAG}" \
            --json tagName,name,isDraft,isPrerelease,body \
            > "${RUNNER_TEMP}/release-metadata.json"
          python - "${RUNNER_TEMP}/release-metadata.json" \
            "${RUNNER_TEMP}/release-notes.md" "${VERSION_TAG}" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_notes = Path(sys.argv[2]).read_text(encoding="utf-8").rstrip()
          version_tag = sys.argv[3]
          if metadata.get("tagName") != version_tag or metadata.get("name") != version_tag:
              raise SystemExit("Existing Release identity does not match the version Tag.")
          if metadata.get("isDraft") or metadata.get("isPrerelease"):
              raise SystemExit("Existing Release is a draft or prerelease.")
          if str(metadata.get("body") or "").rstrip() != expected_notes:
              raise SystemExit("Existing Release notes do not match CHANGELOG.md.")
          PY
