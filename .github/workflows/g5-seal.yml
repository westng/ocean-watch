name: Prepare or Seal G5 Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare evidence or seal an independently signed summary
        required: true
        type: choice
        options:
          - prepare
          - seal
      source_run_ids_json:
        description: Exact six-source workflow run ID JSON object for prepare mode
        required: false
        type: string
      prepared_run_id:
        description: Successful prepare-mode run ID to seal
        required: false
        type: string
      signoff_run_id:
        description: Successful independent G5 signoff run ID
        required: false
        type: string

concurrency:
  group: g5-seal-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: inputs.mode == 'prepare' && github.repository == 'westng/ocean-watch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_IDS_JSON: ${{ inputs.source_run_ids_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify protected current main
        shell: bash
        run: |
          if [[ "${GITHUB_REF_PROTECTED}" != "true" ]]; then
            echo "G5 preparation requires a protected main ref." >&2
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "G5 preparation must use the current origin/main commit." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "G5 preparation requires a clean checkout." >&2
            exit 1
          fi
      - name: Validate explicit source inputs
        shell: bash
        run: |
          printf '%s' "${SOURCE_RUN_IDS_JSON}" > "${RUNNER_TEMP}/source-run-ids-input.json"
          python scripts/acceptance/source_artifacts.py \
            --input "${RUNNER_TEMP}/source-run-ids-input.json" \
            --out "${RUNNER_TEMP}/source-artifacts.json" \
            --tsv-out "${RUNNER_TEMP}/source-artifacts.tsv"
      - name: Verify six successful source runs through GitHub API
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/raw-runs" "${RUNNER_TEMP}/verified-runs"
          verify_run() {
            local key="$1"
            local run_id="$2"
            local workflow="$3"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              > "${RUNNER_TEMP}/raw-runs/${key}.json"
            python scripts/acceptance/verify_workflow_run.py \
              --metadata "${RUNNER_TEMP}/raw-runs/${key}.json" \
              --expected-run-id "${run_id}" \
              --expected-repository "${GITHUB_REPOSITORY}" \
              --expected-workflow-path "${workflow}" \
              --expected-head-sha "${GITHUB_SHA}" \
              --out "${RUNNER_TEMP}/verified-runs/${key}.json"
          }
          while IFS=$'\t' read -r key run_id workflow artifact_name; do
            verify_run "${key}" "${run_id}" "${workflow}"
          done < "${RUNNER_TEMP}/source-artifacts.tsv"
          python scripts/acceptance/source_runs.py \
            --candidate-git-sha "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --formal-evidence-metadata "${RUNNER_TEMP}/verified-runs/formal_evidence.json" \
            --model-evidence-metadata "${RUNNER_TEMP}/verified-runs/model_evidence.json" \
            --canary-evidence-metadata "${RUNNER_TEMP}/verified-runs/canary_evidence.json" \
            --marketplace-evidence-metadata "${RUNNER_TEMP}/verified-runs/marketplace_evidence.json" \
            --rollback-evidence-metadata "${RUNNER_TEMP}/verified-runs/rollback_evidence.json" \
            --rollout-evidence-metadata "${RUNNER_TEMP}/verified-runs/rollout_evidence.json" \
            --out "${RUNNER_TEMP}/source-runs.json"
      - name: Download only named source artifacts
        shell: bash
        run: |
          mkdir -p \
            "${RUNNER_TEMP}/candidate" \
            "${RUNNER_TEMP}/sources/formal" \
            "${RUNNER_TEMP}/sources/model" \
            "${RUNNER_TEMP}/sources/canary" \
            "${RUNNER_TEMP}/sources/marketplace" \
            "${RUNNER_TEMP}/sources/rollback" \
            "${RUNNER_TEMP}/sources/rollout"
          while IFS=$'\t' read -r key run_id workflow artifact_name; do
            source_name="${key%_evidence}"
            if [[ "${key}" == "formal_evidence" ]]; then
              gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
                --name "g5-formal-candidate-${GITHUB_SHA}-${run_id}" \
                --dir "${RUNNER_TEMP}/candidate"
              gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
                --name "g5-automated-evidence-${GITHUB_SHA}-${run_id}" \
                --dir "${RUNNER_TEMP}/sources/formal"
            else
              gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
                --name "${artifact_name}" \
                --dir "${RUNNER_TEMP}/sources/${source_name}"
            fi
          done < "${RUNNER_TEMP}/source-artifacts.tsv"
      - name: Verify formal candidate and five role-bound external bundles
        shell: bash
        run: |
          python scripts/acceptance/p5.py verify-candidate \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --require-release \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/candidate-verification.json"
          python - "${RUNNER_TEMP}/candidate-verification.json" "${RUNNER_TEMP}/candidate-identity.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Path(sys.argv[2]).write_text(
              json.dumps(source["candidate_identity"], ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          for role in model canary marketplace rollback rollout; do
            python scripts/acceptance/external_evidence.py verify \
              --role "${role}" \
              --evidence-root "${RUNNER_TEMP}/sources/${role}" \
              --candidate-identity "${RUNNER_TEMP}/candidate-identity.json" \
              --expected-git-sha "${GITHUB_SHA}" \
              --repository "${GITHUB_REPOSITORY}" \
              --producer-run-metadata "${RUNNER_TEMP}/verified-runs/${role}_evidence.json" \
              --out "${RUNNER_TEMP}/verified-${role}-evidence.json"
          done
          python scripts/acceptance/external_evidence.py verify-set \
            --verification "${RUNNER_TEMP}/verified-model-evidence.json" \
            --verification "${RUNNER_TEMP}/verified-canary-evidence.json" \
            --verification "${RUNNER_TEMP}/verified-marketplace-evidence.json" \
            --verification "${RUNNER_TEMP}/verified-rollback-evidence.json" \
            --verification "${RUNNER_TEMP}/verified-rollout-evidence.json" \
            --out "${RUNNER_TEMP}/verified-external-source-set.json"
      - name: Merge evidence without replacement and build ready summary
        shell: bash
        run: |
          python scripts/acceptance/merge_evidence.py \
            --source "${RUNNER_TEMP}/sources/formal" \
            --source "${RUNNER_TEMP}/sources/model" \
            --source "${RUNNER_TEMP}/sources/canary" \
            --source "${RUNNER_TEMP}/sources/marketplace" \
            --source "${RUNNER_TEMP}/sources/rollback" \
            --source "${RUNNER_TEMP}/sources/rollout" \
            --destination "${RUNNER_TEMP}/prepared/evidence"
          mkdir -p "${RUNNER_TEMP}/prepared/evidence/provenance/source-runs"
          cp "${RUNNER_TEMP}/verified-runs"/*.json \
            "${RUNNER_TEMP}/prepared/evidence/provenance/source-runs/"
          cp "${RUNNER_TEMP}/source-runs.json" \
            "${RUNNER_TEMP}/prepared/evidence/provenance/source-runs/source-runs.json"
          python scripts/acceptance/build_final_summary.py \
            --shard-root "${RUNNER_TEMP}/prepared/evidence/native" \
            --external-root "${RUNNER_TEMP}/prepared/evidence" \
            --candidate-identity "${RUNNER_TEMP}/candidate-identity.json" \
            --source-runs "${RUNNER_TEMP}/source-runs.json" \
            --git-sha "${GITHUB_SHA}" \
            --gate G5 \
            --require-ready \
            --out "${RUNNER_TEMP}/prepared/summary.json"
          cp -R "${RUNNER_TEMP}/candidate" "${RUNNER_TEMP}/prepared/candidate"
          python scripts/acceptance/scan_evidence.py "${RUNNER_TEMP}/prepared/evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: g5-prepared-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 90

  seal:
    if: inputs.mode == 'seal' && github.repository == 'westng/ocean-watch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: g5-release-seal
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
      SIGNOFF_RUN_ID: ${{ inputs.signoff_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify selected producer runs
        shell: bash
        run: |
          if [[ "${GITHUB_REF_PROTECTED}" != "true" ]]; then
            echo "G5 sealing requires a protected main ref." >&2
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "G5 sealing must use the current origin/main commit." >&2
            exit 1
          fi
          for value in "${PREPARED_RUN_ID}" "${SIGNOFF_RUN_ID}"; do
            if [[ ! "${value}" =~ ^[1-9][0-9]*$ ]]; then
              echo "Seal inputs must be positive workflow run IDs." >&2
              exit 1
            fi
          done
          if [[ "${PREPARED_RUN_ID}" == "${SIGNOFF_RUN_ID}" ]]; then
            echo "Prepared evidence and independent signoff must come from different runs." >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/run-metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARED_RUN_ID}" \
            > "${RUNNER_TEMP}/run-metadata/prepared-raw.json"
          python scripts/acceptance/verify_workflow_run.py \
            --metadata "${RUNNER_TEMP}/run-metadata/prepared-raw.json" \
            --expected-run-id "${PREPARED_RUN_ID}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-path .github/workflows/g5-seal.yml \
            --expected-head-sha "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/run-metadata/prepared-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SIGNOFF_RUN_ID}" \
            > "${RUNNER_TEMP}/run-metadata/signoff-raw.json"
          python scripts/acceptance/verify_workflow_run.py \
            --metadata "${RUNNER_TEMP}/run-metadata/signoff-raw.json" \
            --expected-run-id "${SIGNOFF_RUN_ID}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-path .github/workflows/g5-signoff.yml \
            --expected-head-sha "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/run-metadata/signoff-run.json"
      - name: Download exact prepared summary and restricted signoff
        shell: bash
        run: |
          gh run download "${PREPARED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "g5-prepared-${GITHUB_SHA}-${PREPARED_RUN_ID}" \
            --dir "${RUNNER_TEMP}/prepared"
          gh run download "${SIGNOFF_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "g5-signoff-${GITHUB_SHA}-${SIGNOFF_RUN_ID}" \
            --dir "${RUNNER_TEMP}/signoff"
      - name: Verify independent approvals and seal release
        shell: bash
        run: |
          python scripts/acceptance/verify_gate_signoff.py \
            "${RUNNER_TEMP}/signoff/signoff.json" \
            --summary "${RUNNER_TEMP}/prepared/summary.json" \
            --expected-git-sha "${GITHUB_SHA}" \
            --reject-tracked-signoff
          python scripts/release/sealed_release.py seal \
            --candidate-dir "${RUNNER_TEMP}/prepared/candidate" \
            --evidence-root "${RUNNER_TEMP}/prepared/evidence" \
            --summary "${RUNNER_TEMP}/prepared/summary.json" \
            --signoff "${RUNNER_TEMP}/signoff/signoff.json" \
            --prepared-run "${RUNNER_TEMP}/run-metadata/prepared-run.json" \
            --signoff-run "${RUNNER_TEMP}/run-metadata/signoff-run.json" \
            --expected-commit "${GITHUB_SHA}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --out-dir "${RUNNER_TEMP}/sealed"
          python scripts/release/sealed_release.py verify \
            --sealed-dir "${RUNNER_TEMP}/sealed" \
            --expected-commit "${GITHUB_SHA}" \
            --expected-repository "${GITHUB_REPOSITORY}"
      - uses: actions/upload-artifact@v4
        with:
          name: g5-sealed-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed
          if-no-files-found: error
          retention-days: 90
