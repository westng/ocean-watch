name: Intake Role-Bound External G5 Evidence

on:
  workflow_dispatch:
    inputs:
      role:
        description: Fixed external G5 evidence role
        required: true
        type: choice
        options:
          - model
          - canary
          - marketplace
          - rollback
          - rollout
      formal_run_id:
        description: Successful G5 Formal Candidate Evidence run ID
        required: true
        type: string
      source_run_id:
        description: Successful external producer workflow run ID
        required: true
        type: string

concurrency:
  group: g5-external-evidence-${{ github.ref }}-${{ inputs.role }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  attest-external-evidence:
    if: github.repository == 'westng/ocean-watch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: g5-external-evidence
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_ROLE: ${{ inputs.role }}
      FORMAL_RUN_ID: ${{ inputs.formal_run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify protected current main and immutable inputs
        shell: bash
        run: |
          if [[ "${GITHUB_REF_PROTECTED}" != "true" ]]; then
            echo "External G5 evidence intake requires a protected main ref." >&2
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "External G5 evidence intake must use current origin/main." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "External G5 evidence intake requires a clean checkout." >&2
            exit 1
          fi
          for value in "${FORMAL_RUN_ID}" "${SOURCE_RUN_ID}"; do
            if [[ ! "${value}" =~ ^[1-9][0-9]*$ ]]; then
              echo "External G5 source inputs must be positive workflow run IDs." >&2
              exit 1
            fi
          done
          if [[ "${FORMAL_RUN_ID}" == "${SOURCE_RUN_ID}" ]]; then
            echo "Formal and external source evidence must use different runs." >&2
            exit 1
          fi
          SOURCE_ARTIFACT_NAME="g5-${EVIDENCE_ROLE}-source-${SOURCE_RUN_ID}"
          echo "SOURCE_ARTIFACT_NAME=${SOURCE_ARTIFACT_NAME}" >> "${GITHUB_ENV}"
      - name: Verify formal and external producer runs
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/run-metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FORMAL_RUN_ID}" \
            > "${RUNNER_TEMP}/run-metadata/formal-raw.json"
          python scripts/acceptance/verify_workflow_run.py \
            --metadata "${RUNNER_TEMP}/run-metadata/formal-raw.json" \
            --expected-run-id "${FORMAL_RUN_ID}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-path .github/workflows/g5-evidence.yml \
            --expected-head-sha "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/run-metadata/formal.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > "${RUNNER_TEMP}/run-metadata/source-raw.json"
          python scripts/acceptance/verify_workflow_run.py \
            --metadata "${RUNNER_TEMP}/run-metadata/source-raw.json" \
            --expected-run-id "${SOURCE_RUN_ID}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-head-sha "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/run-metadata/source.json"
      - name: Download formal candidate and named external artifact
        shell: bash
        run: |
          gh run download "${FORMAL_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "g5-formal-candidate-${GITHUB_SHA}-${FORMAL_RUN_ID}" \
            --dir "${RUNNER_TEMP}/candidate"
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${SOURCE_ARTIFACT_NAME}" \
            --dir "${RUNNER_TEMP}/evidence"
      - name: Attest fixed role evidence against the formal candidate
        shell: bash
        run: |
          python scripts/acceptance/p5.py verify-candidate \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --require-release \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/candidate-verification.json"
          python - "${RUNNER_TEMP}/candidate-verification.json" "${RUNNER_TEMP}/candidate-identity.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Path(sys.argv[2]).write_text(
              json.dumps(source["candidate_identity"], ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python scripts/acceptance/external_evidence.py attest \
            --role "${EVIDENCE_ROLE}" \
            --evidence-root "${RUNNER_TEMP}/evidence" \
            --candidate-identity "${RUNNER_TEMP}/candidate-identity.json" \
            --expected-git-sha "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --producer-run-id "${GITHUB_RUN_ID}" \
            --producer-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-run-metadata "${RUNNER_TEMP}/run-metadata/source.json" \
            --source-artifact-name "${SOURCE_ARTIFACT_NAME}" \
            --out "${RUNNER_TEMP}/attestation-result.json"
          python scripts/acceptance/scan_evidence.py "${RUNNER_TEMP}/evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: g5-${{ inputs.role }}-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 90
