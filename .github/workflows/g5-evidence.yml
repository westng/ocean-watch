name: G5 Formal Candidate Evidence

on:
  workflow_dispatch:

concurrency:
  group: g5-evidence-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.5

jobs:
  build-formal-candidate:
    if: github.repository == 'westng/ocean-watch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: g5-release-candidate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Verify protected main identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF_PROTECTED}" != "true" ]]; then
            echo "Formal G5 evidence requires a protected main ref." >&2
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The selected commit is not the current origin/main commit." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Formal G5 evidence requires a clean checkout." >&2
            exit 1
          fi
      - name: Build the formal signed candidate twice
        env:
          OCEAN_WATCH_RELEASE_SIGNING_KEY: ${{ secrets.OCEAN_WATCH_RELEASE_SIGNING_KEY }}
        run: |
          python scripts/release/build_candidate.py \
            --out-dir "${RUNNER_TEMP}/formal-candidate" \
            --release
          python scripts/release/build_candidate.py \
            --out-dir "${RUNNER_TEMP}/reproducible-candidate" \
            --release
      - name: Verify reproducibility and protected trust root
        env:
          OCEAN_WATCH_RELEASE_PUBLIC_KEY: ${{ vars.OCEAN_WATCH_RELEASE_PUBLIC_KEY }}
        run: |
          python scripts/acceptance/p5.py supply-chain \
            --first-dir "${RUNNER_TEMP}/formal-candidate" \
            --second-dir "${RUNNER_TEMP}/reproducible-candidate" \
            --require-release \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/build-evidence/security/ac-125-supply-chain.json"
          python scripts/acceptance/protected_release_evidence.py \
            --candidate-dir "${RUNNER_TEMP}/formal-candidate" \
            --expected-commit "${GITHUB_SHA}" \
            --environment-name g5-release-candidate \
            --out "${RUNNER_TEMP}/build-evidence/security/ac-125-release-trust-root.json"
          python scripts/acceptance/p5.py verify-candidate \
            --candidate-dir "${RUNNER_TEMP}/formal-candidate" \
            --require-release \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/build-evidence/candidate-verification.json"
          python scripts/acceptance/scan_evidence.py "${RUNNER_TEMP}/build-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: g5-formal-candidate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/formal-candidate
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: g5-build-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/build-evidence
          if-no-files-found: error
          retention-days: 90

  native-formal-candidate:
    needs: build-formal-candidate
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2025
            platform: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Install Python baseline
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: g5-formal-candidate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Consume formal candidate on Darwin or Linux
        if: runner.os != 'Windows'
        run: >-
          scripts/acceptance/run.sh --suite native-candidate
          --candidate-dir "${{ runner.temp }}/candidate"
          --out-dir "${{ runner.temp }}/native/${{ matrix.platform }}"
          --expected-platform "${{ matrix.platform }}"
          --expected-commit "${{ github.sha }}"
          --require-release
      - name: Consume formal candidate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          scripts/acceptance/run.ps1 -Suite native-candidate
          -CandidateDir "${{ runner.temp }}/candidate"
          -EvidenceDir "${{ runner.temp }}/native/${{ matrix.platform }}"
          -ExpectedPlatform "${{ matrix.platform }}"
          -GitSha "${{ github.sha }}"
          -RequireRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-native-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 90

  assemble-automated-evidence:
    needs: [build-formal-candidate, native-formal-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Install Python baseline and pinned security tools
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
      - uses: actions/download-artifact@v4
        with:
          pattern: g5-native-*-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-downloads
      - uses: actions/download-artifact@v4
        with:
          name: g5-formal-candidate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: g5-build-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - name: Normalize five native shards
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence/native"
          for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
            source="${RUNNER_TEMP}/native-downloads/g5-native-${platform}-${GITHUB_SHA}-${GITHUB_RUN_ID}"
            if [[ ! -d "${source}" ]]; then
              echo "Missing native shard: ${platform}" >&2
              exit 1
            fi
            mv "${source}" "${RUNNER_TEMP}/evidence/native/${platform}"
          done
      - name: Reverify candidate and automated evidence
        run: |
          python scripts/acceptance/p5.py verify-candidate \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --require-release \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/candidate-verification.json"
          cp "${RUNNER_TEMP}/candidate-verification.json" \
            "${RUNNER_TEMP}/evidence/candidate-verification.json"
          python - "${RUNNER_TEMP}/candidate-verification.json" "${RUNNER_TEMP}/candidate-identity.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Path(sys.argv[2]).write_text(
              json.dumps(source["candidate_identity"], ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python scripts/acceptance/assemble_native_matrix.py \
            --shard-root "${RUNNER_TEMP}/evidence/native" \
            --candidate-identity "${RUNNER_TEMP}/candidate-identity.json" \
            --acceptance-id AC-107 \
            --out "${RUNNER_TEMP}/evidence/release/ac-107-platform-matrix.json"
          python scripts/acceptance/benchmark_candidate.py \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/evidence/performance/ac-122-benchstat.json"
      - name: Run complete source quality and security gates
        shell: bash
        run: |
          python -m compileall -q skills/ads-plan-monitor/src/ocean_watch scripts
          ruff check skills/ads-plan-monitor/src scripts tests
          bandit -q --severity-level medium -r skills/ads-plan-monitor/src/ocean_watch scripts
          python -m unittest discover -s tests
          mkdir -p "${RUNNER_TEMP}/evidence/security"
          for module in prototype/ocean-watch-go prototype/runtime-bootstrap; do
            go -C "${module}" test ./...
            go -C "${module}" test -race ./...
            go -C "${module}" vet ./...
            (cd "${module}" && staticcheck ./...)
            (cd "${module}" && govulncheck ./...)
            report="${RUNNER_TEMP}/evidence/security/gosec-$(basename "${module}").json"
            (cd "${module}" && gosec -quiet -exclude-generated -no-fail -fmt=json -out="${report}" ./...)
            python scripts/acceptance/verify_gosec_report.py \
              --report "${report}" \
              --module "${module}" \
              --out "${RUNNER_TEMP}/evidence/security/gosec-audit-$(basename "${module}").json"
            (cd "${module}" && gosec -quiet -exclude-generated -severity high ./...)
          done
          if grep -R -n -E --include='*.go' \
            'LogEnable[[:space:]]*=[[:space:]]*true|UseLogMw[[:space:]]*=[[:space:]]*true|SetLogEnable[[:space:]]*\([[:space:]]*true' \
            prototype/ocean-watch-go; then
            echo "Official SDK request/response logging must remain disabled." >&2
            exit 1
          fi
          printf '%s\n' 'official SDK request/response logging enablement count: 0' \
            > "${RUNNER_TEMP}/evidence/security/sdk-log-scan.txt"
          python scripts/acceptance/check_docs_links.py
          python scripts/acceptance/scan_evidence.py "${RUNNER_TEMP}/evidence"
          python scripts/acceptance/scan_evidence.py testdata
      - uses: actions/upload-artifact@v4
        with:
          name: g5-automated-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 90
