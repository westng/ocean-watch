name: Validate Independent G5 Signoff

on:
  workflow_dispatch:
    inputs:
      prepared_run_id:
        description: Successful prepare-mode G5 run ID reviewed by all approvers
        required: true
        type: string

concurrency:
  group: g5-signoff-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate-independent-signoff:
    if: github.repository == 'westng/ocean-watch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: g5-independent-signoff
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
      G5_SIGNOFF_JSON_BASE64: ${{ secrets.G5_SIGNOFF_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify protected current main and prepared run
        shell: bash
        run: |
          if [[ "${GITHUB_REF_PROTECTED}" != "true" ]]; then
            echo "G5 signoff requires a protected main ref." >&2
            exit 1
          fi
          if [[ ! "${PREPARED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "prepared_run_id must be a positive workflow run ID." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARED_RUN_ID}" \
            > "${RUNNER_TEMP}/prepared-run-raw.json"
          python scripts/acceptance/verify_workflow_run.py \
            --metadata "${RUNNER_TEMP}/prepared-run-raw.json" \
            --expected-run-id "${PREPARED_RUN_ID}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-path .github/workflows/g5-seal.yml \
            --expected-head-sha "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/prepared-run.json"
          gh run download "${PREPARED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "g5-prepared-${GITHUB_SHA}-${PREPARED_RUN_ID}" \
            --dir "${RUNNER_TEMP}/prepared"
      - name: Consume externally assembled six-role signoff
        shell: bash
        run: |
          if [[ -z "${G5_SIGNOFF_JSON_BASE64}" ]]; then
            echo "The restricted external G5 signoff input is missing." >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/restricted-signoff"
          if ! printf '%s' "${G5_SIGNOFF_JSON_BASE64}" \
            | base64 --decode > "${RUNNER_TEMP}/restricted-signoff/signoff.json"; then
            echo "The restricted external G5 signoff input is not valid base64." >&2
            exit 1
          fi
          unset G5_SIGNOFF_JSON_BASE64
          python scripts/acceptance/verify_gate_signoff.py \
            "${RUNNER_TEMP}/restricted-signoff/signoff.json" \
            --summary "${RUNNER_TEMP}/prepared/summary.json" \
            --expected-git-sha "${GITHUB_SHA}" \
            --reject-tracked-signoff
      - uses: actions/upload-artifact@v4
        with:
          name: g5-signoff-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/restricted-signoff
          if-no-files-found: error
          retention-days: 90
