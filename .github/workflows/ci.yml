name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m py_compile skills/ads-plan-monitor/scripts/*.py
        shell: bash
      - name: Validate example JSON
        run: |
          python -m json.tool .codex-plugin/plugin.json > /dev/null
          python -m json.tool .agents/plugins/marketplace.json > /dev/null
          python -m json.tool skills/ads-plan-monitor/assets/config.example.json > /dev/null
        shell: bash
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill metadata
        run: python -c "from pathlib import Path; text=Path('skills/ads-plan-monitor/SKILL.md').read_text(encoding='utf-8'); assert text.startswith('---\\nname: ads-plan-monitor\\ndescription:'); assert text.count('\\n---\\n') >= 1"
