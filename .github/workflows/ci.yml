name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile scripts
        run: python -c "from pathlib import Path; import py_compile; [py_compile.compile(str(path), doraise=True) for path in Path('skills/ads-plan-monitor/scripts').glob('*.py')]"
      - name: Validate example JSON
        run: python -c "from pathlib import Path; import json; [json.loads(Path(path).read_text(encoding='utf-8')) for path in ['.codex-plugin/plugin.json', '.agents/plugins/marketplace.json', 'skills/ads-plan-monitor/assets/config.example.json']]"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill metadata
        run: |
          python -c "from pathlib import Path; text=Path('skills/ads-plan-monitor/SKILL.md').read_text(encoding='utf-8'); assert text.startswith('---\\nname: ads-plan-monitor\\ndescription:'); assert text.count('\\n---\\n') >= 1"
