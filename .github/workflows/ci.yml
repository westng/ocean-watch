name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and quality tools
        run: python -m pip install --disable-pip-version-check -e . ruff
      - name: Compile package
        run: python -m compileall -q skills/ads-plan-monitor/src/ocean_watch
      - name: Lint package and tests
        run: ruff check skills/ads-plan-monitor/src tests
      - name: Verify CLI
        run: ocean-watch --version
      - name: Validate example JSON
        run: python -c "from pathlib import Path; import json; [json.loads(Path(path).read_text(encoding='utf-8')) for path in ['.codex-plugin/plugin.json', '.agents/plugins/marketplace.json', 'skills/ads-plan-monitor/assets/config.example.json', 'skills/ads-plan-monitor/assets/creator-batch-jobs.example.json']]"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
