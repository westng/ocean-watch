name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.5

jobs:
  python:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q skills/ads-plan-monitor/src/ocean_watch scripts
      - name: Lint package and tests
        run: ruff check skills/ads-plan-monitor/src scripts tests
      - name: Scan package security
        run: bandit -q --severity-level medium -r skills/ads-plan-monitor/src/ocean_watch scripts
      - name: Verify CLI
        run: ocean-watch --version
      - name: Verify source-installed first run
        env:
          CODEX_HOME: ${{ runner.temp }}/ocean-watch-codex-home
        run: ocean-watch setup init --home-config
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  python-compatibility:
    name: Python 3.9 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile production package
        run: python -m compileall -q skills/ads-plan-monitor/src/ocean_watch
      - name: Verify CLI and first run
        env:
          CODEX_HOME: ${{ runner.temp }}/ocean-watch-codex-home
        run: |
          ocean-watch --version
          ocean-watch setup init --home-config
      - name: Run compatibility regression tests
        run: >-
          python -m unittest -v
          tests.test_api_client
          tests.test_cli
          tests.test_environment_check
          tests.test_managed_accounts
          tests.test_managed_accounts_report
          tests.test_plugin_metadata
          tests.test_token_refresh

  go-quality:
    name: Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Test and vet Go modules
        shell: bash
        run: |
          go -C prototype/ocean-watch-go test ./...
          go -C prototype/ocean-watch-go vet ./...
          go -C prototype/runtime-bootstrap test ./...
          go -C prototype/runtime-bootstrap vet ./...
