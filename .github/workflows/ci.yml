name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.5

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q skills/ads-plan-monitor/src/ocean_watch scripts
      - name: Lint package and tests
        run: ruff check skills/ads-plan-monitor/src scripts tests
      - name: Scan package security
        run: bandit -q --severity-level medium -r skills/ads-plan-monitor/src/ocean_watch scripts
      - name: Verify CLI
        run: ocean-watch --version
      - name: Verify source-installed first run
        env:
          CODEX_HOME: ${{ runner.temp }}/ocean-watch-codex-home
        run: ocean-watch setup init --home-config
      - name: Validate example JSON
        run: python -c "from pathlib import Path; import json; [json.loads(Path(path).read_text(encoding='utf-8')) for path in ['.codex-plugin/plugin.json', '.agents/plugins/marketplace.json', 'skills/ads-plan-monitor/assets/config.example.json', 'skills/ads-plan-monitor/assets/creator-batch-jobs.example.json', 'skills/qc-plan-monitor/assets/qianchuan-product-plan.example.json', 'skills/qc-plan-monitor/assets/qianchuan-live-plan.example.json', 'skills/ads-plan-monitor/src/ocean_watch/resources/config.example.json']]"
      - name: Validate Plugin and Skill metadata
        run: python -m unittest tests.test_plugin_metadata -v
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Capture native P0 state evidence
        if: matrix.python == '3.12'
        run: python scripts/acceptance/probe_state_compatibility.py --out "${{ runner.temp }}/p0-state/state-probe.json"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: p0-state-${{ runner.os }}
          path: ${{ runner.temp }}/p0-state/state-probe.json
          if-no-files-found: error
          retention-days: 90

  build-test-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # RFC 8032 test vector 1 seed. This is public test material, never a release key.
      OCEAN_WATCH_RELEASE_SIGNING_KEY: 9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60
      TEST_PUBLIC_KEY: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Build one signed non-release candidate
        run: python scripts/release/build_candidate.py --out-dir "${RUNNER_TEMP}/candidate"
      - name: Verify test identity and signatures
        shell: bash
        run: |
          if ! printf '%s\n' "${TEST_PUBLIC_KEY}" \
            | cmp -s - "${RUNNER_TEMP}/candidate/release-public-key.txt"; then
            echo "The CI candidate did not use the public RFC 8032 test identity." >&2
            exit 1
          fi
          python scripts/acceptance/p5.py verify-candidate \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --expected-commit "${GITHUB_SHA}" \
            --out "${RUNNER_TEMP}/candidate-verification.json"
          python - "${RUNNER_TEMP}/candidate-verification.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result["candidate_identity"]["release"] is not False:
              raise SystemExit("ordinary CI must never produce formal G5 identity")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ci-test-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14

  go-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [prototype/ocean-watch-go, prototype/runtime-bootstrap]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Test Go module
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Race test Go module
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
      - name: Vet Go module
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  native-test-candidate:
    needs: build-test-candidate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2025
            platform: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Install Python baseline
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Consume the shared candidate on Darwin or Linux
        if: runner.os != 'Windows'
        run: >-
          scripts/acceptance/run.sh --suite native-candidate
          --candidate-dir "${{ runner.temp }}/candidate"
          --out-dir "${{ runner.temp }}/native/${{ matrix.platform }}"
          --expected-platform "${{ matrix.platform }}"
          --expected-commit "${{ github.sha }}"
      - name: Consume the shared candidate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          scripts/acceptance/run.ps1 -Suite native-candidate
          -CandidateDir "${{ runner.temp }}/candidate"
          -EvidenceDir "${{ runner.temp }}/native/${{ matrix.platform }}"
          -ExpectedPlatform "${{ matrix.platform }}"
          -GitSha "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-native-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/native/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
