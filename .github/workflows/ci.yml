name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: runtime/ocean-watch-go/go.sum
      - name: Test Go runtime
        working-directory: runtime/ocean-watch-go
        run: go test ./...
      - name: Vet Go runtime
        working-directory: runtime/ocean-watch-go
        run: go vet ./...
      - name: Verify Unix launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          skills/ads-plan-monitor/run --version
          skills/qc-plan-monitor/run --help
      - name: Verify Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          skills\ads-plan-monitor\run.cmd --version
          skills\qc-plan-monitor\run.cmd --help

  f2:
    name: F2 / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install F2 boundary
        run: python -m pip install --disable-pip-version-check "f2==0.0.1.7" "socksio>=1,<2" "tomli>=2,<3; python_version < '3.11'" PyYAML
      - name: Validate metadata and F2 wrapper
        run: |
          python scripts/version_tag.py check
          python -m unittest discover -s f2 -p "test_resolve.py" -v
          python -m compileall -q f2 scripts

  plugin:
    name: Plugin contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate Skills and Plugin
        run: python scripts/validate_distribution.py
