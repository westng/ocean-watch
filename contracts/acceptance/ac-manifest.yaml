schema_version: 1
sdk_version: v1.1.92
go_toolchain: go1.26.5
evidence_layout: artifacts/go-sdk-acceptance/<git-sha>/<platform>
required_platforms: [darwin-arm64, darwin-amd64, linux-amd64, linux-arm64, windows-amd64]
statuses:
  - passed
  - failed
  - blocked
  - not_run
gates:
  G0:
    required_roles: [MT, AO, QO, SO, SCO]
    acceptance: [AC-101, AC-102, AC-103, AC-104, AC-105, AC-106, AC-107, AC-114, AC-125, AC-128]
  G1:
    required_roles: [AO, RL, QO, SCO]
    acceptance: [AC-101, AC-102, AC-103, AC-104, AC-105, AC-106, AC-107, AC-123]
  G2:
    required_roles: [AP, MA, QA-API, QO, SO]
    acceptance: [AC-104, AC-108, AC-109, AC-110, AC-111, AC-112, AC-113, AC-114]
  G3:
    required_roles: [MA, QA-API, RL, QO, SCO]
    acceptance: [AC-105, AC-112, AC-113, AC-114, AC-115, AC-122, AC-123]
  G4:
    required_roles: [MT, MA, QA-API, QO, SO, RO]
    acceptance: [AC-105, AC-116, AC-117, AC-118, AC-119, AC-120, AC-121, AC-122, AC-123, AC-127]
  G5:
    required_roles: [MT, AO, QO, SO, RO, SCO]
    acceptance:
      - AC-101
      - AC-102
      - AC-103
      - AC-104
      - AC-105
      - AC-106
      - AC-107
      - AC-108
      - AC-109
      - AC-110
      - AC-111
      - AC-112
      - AC-113
      - AC-114
      - AC-115
      - AC-116
      - AC-117
      - AC-118
      - AC-119
      - AC-120
      - AC-121
      - AC-122
      - AC-123
      - AC-124
      - AC-125
      - AC-126
      - AC-127
      - AC-128
acceptance:
  AC-101:
    title: Command tree and argument compatibility
    owners: [QO, SCO]
    gates: [G0, G1, G5]
    tests:
      normal:
        - TestCommandsMatchFrozenManifest
        - TestReadCommandManifestMatchesGoContract
        - TestBuiltinCasesCoverVersionAndEveryHelpLevel
        - TestTopLevelAndDomainHelpPreserveArguments
    evidence: contracts/ac-101-command-parity.json
    required_evidence:
      - id: commit-bound-contract-comparison
        kind: contract_report
        evidence: contracts/go/report.json
        platform_bound: true
  AC-102:
    title: JSON process boundary and exit codes
    owners: [QO]
    gates: [G1, G5]
    tests:
      normal:
        - TestNormalizeProcessResultCanonicalizesJSONAndPresentation
        - TestInvalidCommandProducesOneJSONError
        - TestSetupExitCodesRemainCompatible
        - TestWriteJSONDestinationIsAtomicPrivateAndMatchesStdout
    evidence: contracts/ac-102-process-boundary.json
    required_evidence:
      - id: commit-bound-contract-comparison
        kind: contract_report
        evidence: contracts/go/report.json
        platform_bound: true
  AC-103:
    title: Responsible account membership contract
    owners: [SCO, QO]
    gates: [G0, G1, G5]
    tests:
      normal:
        - TestAccountStoreReadIsWriteFree
        - TestAccountListUsesGoWithoutFallback
        - TestRunnerObserverReportsZeroNetworkUseForAccountList
        - TestManagedAccountEmptyPresentationMatchesGolden
    evidence: contracts/ac-103-membership.json
    external_requirements:
      - id: skill-model-responsible-account-membership
        kind: model_eval
        evidence: contracts/ac-103-skill-eval.json
        minimum_trials: 3
  AC-104:
    title: Account report endpoint isolation
    owners: [MA, QA-API]
    gates: [G2, G5]
    tests:
      normal:
        - TestAccountReportAdaptersUseOnlyGeneratedAggregateServices
        - TestAccountReportPreservesOrderAndContainsSingleAccountFailure
        - TestRunnerAccountReportShadowAssemblesTokenAndSDKAdapters
    evidence: contracts/ac-104-service-calls.json
  AC-105:
    title: Mandatory presentation preservation
    owners: [SCO, QO]
    gates: [G0, G1, G3, G4, G5]
    tests:
      normal:
        - TestManagedAccountEmptyPresentationMatchesGolden
        - TestAccountReportPresentationMatchesPythonGolden
        - TestQianchuanBatchEmptyPresentationMatchesGolden
        - TestBatchWorkIdempotencyAndPresentation
    evidence: contracts/ac-105-presentation-diff.json
    required_evidence:
      - id: commit-bound-contract-comparison
        kind: contract_report
        evidence: contracts/go/report.json
        platform_bound: true
    external_requirements:
      - id: skill-model-mandatory-presentation
        kind: model_eval
        evidence: contracts/ac-105-skill-eval.json
        minimum_trials: 3
  AC-106:
    title: Legacy state schema and path compatibility
    owners: [RL, AP]
    gates: [G0, G1, G5]
    tests:
      normal:
        - TestMigrateChannelsPreservesUnknownFieldsAndStripsCredentials
        - TestConfigStoreReadIsWriteFree
        - TestConfigStoreUpdatePreservesUnknownFieldsAndBackup
        - TestAuthorizationMigrationFilesystemRoundTripIsIdempotentAndRedacted
        - TestLegacyMarketingAndQianchuanProductMigrationAreReadOnly
    evidence: contracts/ac-106-state-roundtrip.json
  AC-107:
    title: Lock atomic write and credential compatibility
    owners: [AP, RL, SO]
    gates: [G0, G1, G2, G5]
    tests:
      normal:
        - TestAtomicWriteReplaceFailureKeepsOriginalAndCleansTemporary
        - TestCredentialCompatibilityIdentifiers
        - TestCredentialBackendsUsePythonServiceAndAccountNames
      race:
        - TestConfigStoreSerializesConcurrentUpdates
        - TestCrossRuntimeLockMutualExclusion
    evidence: contracts/ac-107-concurrency.json
    external_requirements:
      - id: native-lock-and-credential-matrix
        kind: native_platform_matrix
        evidence: release/ac-107-platform-matrix.json
        required_platforms: [darwin-arm64, darwin-amd64, linux-amd64, linux-arm64, windows-amd64]
  AC-108:
    title: OAuth callback and state validation
    owners: [AP, SO]
    gates: [G2, G5]
    tests:
      normal:
        - TestOAuthStateContract
        - TestOAuthStateRejectsMismatchAndWrongChannelBeforeExchange
        - TestOAuthCallbackStateValidatedBeforeExchange
        - TestOAuthCallbackStateRejectsExpiredSession
        - TestOAuthCallbackStateHTTPBoundary
        - TestOAuthCallbackStateLoopbackAndPortOccupation
    evidence: contracts/ac-108-oauth-state.json
  AC-109:
    title: Redaction host redirect and response limits
    owners: [SO]
    gates: [G2, G5]
    tests:
      normal:
        - TestFactoryPinsEveryOfficialProfileAndDisablesSDKLogs
        - TestSecurityTransportRejectsEscapedHost
        - TestSecurityTransportLimitsUnknownLengthResponse
        - TestSecurityTransportRedactsNestedTransportFailureAndPreservesCancellation
        - TestGovernedTransportFailsClosedWithoutLeakingToken
        - TestEnvelopeErrorExposesOnlyRedactedOfficialSummary
    evidence: security/ac-109-redaction.json
  AC-110:
    title: Token refresh singleflight and channel isolation
    owners: [AP]
    gates: [G2, G5]
    tests:
      normal:
        - TestTokenRefreshSingleflightAndIsolation
        - TestTokenRefreshFailureKeepsOldRevisionActive
        - TestForceRefreshWaiterReusesConcurrentRotation
      race:
        - TestTokenRefreshSingleflightAndIsolation
        - TestTokenRefreshFailureKeepsOldRevisionActive
        - TestForceRefreshWaiterReusesConcurrentRotation
    evidence: contracts/ac-110-refresh-counts.json
  AC-111:
    title: Complete advertiser synchronization snapshot
    owners: [AP, QO]
    gates: [G2, G5]
    tests:
      normal:
        - TestAdvertiserSnapshotTransaction
        - TestAdvertiserSnapshotTransactionRequiresExplicitRebind
        - TestAdvertiserDiscoveryUsesGeneratedRoleServicesAndRetriesCurrentPage
        - TestAdvertiserDiscoveryFailsClosedOnDuplicateOrIncompleteVerification
    evidence: contracts/ac-111-snapshot.json
  AC-112:
    title: Page-local retry and pagination fail closure
    owners: [QO, RL]
    gates: [G2, G3, G5]
    tests:
      normal:
        - TestPageLocalRetryStateMachine
        - TestPageLocalRetryStateMachineFailsClosed
        - TestPageLocalRetryStateMachineRejectsStalledCursor
        - TestRetryPolicyHonorsBoundedRetryAfter
    evidence: performance/ac-112-call-sequence.json
  AC-113:
    title: Report metric source precision and aggregation
    owners: [MA, QA-API, QO]
    gates: [G2, G3, G5]
    tests:
      normal:
        - TestReportMetricContracts
        - TestMarketingReportSchemaAndCustomContracts
        - TestMarketingPlanReportNegotiatesFieldsAndAggregatesAllPages
        - TestCrossChannelSummaryOnlyCombinesSpend
    evidence: contracts/ac-113-report-metrics.json
  AC-114:
    title: Generated services envelopes and DTO boundary
    owners: [AO, MA, QA-API, AP]
    gates: [G0, G2, G3, G4, G5]
    tests:
      normal:
        - TestServiceAnchorCompilesOfficialGeneratedServices
        - TestMarketingGeneratedServiceContracts
        - TestQianchuanReadGeneratedServiceContracts
        - TestQianchuanReportGeneratedServiceContracts
        - TestOfficialSDKImportsStayInsideOceanEngineAdapter
        - TestEnvelopeGuardRejectsHTTP200BusinessError
    evidence: contracts/ac-114-endpoint-coverage.json
  AC-115:
    title: Qianchuan plan report SDK REST parity
    owners: [QA-API, QO]
    gates: [G3, G5]
    tests:
      normal:
        - TestQianchuanPlanReportSDKParity
        - TestQianchuanReportRetriesOnlyCurrentPageAndIgnoresListFinance
        - TestRunnerQianchuanReportShadowContracts
    evidence: contracts/ac-115-sdk-mcp-shadow.json
  AC-116:
    title: Dry-run submit and write authorization boundary
    owners: [SO, QO]
    gates: [G4, G5]
    tests:
      normal:
        - TestWriteAuthorizationBoundary
        - TestCreateDryRunNeedsNoCredentialsOrWriter
        - TestMarketingCreateServiceDryRunNeverExecutes
        - TestDeleteDryRunDoesNotWrite
    evidence: contracts/ac-116-write-guard.json
  AC-117:
    title: Marketing project promotion transaction and resume
    owners: [MA, QO]
    gates: [G4, G5]
    tests:
      normal:
        - TestProjectPromotionTransaction
        - TestMarketingBatchResumesPromotionAndSkipsCompleted
        - TestMarketingBatchRecoversDispatchWindowsBeforeWriting
    evidence: contracts/ac-117-marketing-transaction.json
  AC-118:
    title: Marketing unknown write reconciliation
    owners: [MA, SO]
    gates: [G4, G5]
    tests:
      normal:
        - TestUnknownWriteReconciliation
        - TestUnknownWriteIsDispatchedOnce
        - TestReconciliationStatesAreClosed
        - TestMarketingPlanAdapterClassifiesWriteDispatchBoundary
    evidence: contracts/ac-118-reconciliation.json
  AC-119:
    title: Qianchuan current-day reconciliation
    owners: [QA-API, QO]
    gates: [G4, G5]
    tests:
      normal:
        - TestCurrentDayPlanReconciliation
        - TestUnknownCreateQueriesCurrentStateWithoutReplay
        - TestQianchuanPlanListUsesCurrentDayAndDoesNotExposeStatsInfo
    evidence: performance/ac-119-plan-scan.json
  AC-120:
    title: Qianchuan batch idempotency and completion format
    owners: [QA-API, SCO]
    gates: [G4, G5]
    tests:
      normal:
        - TestBatchWorkIdempotencyAndPresentation
    evidence: performance/ac-120-batch-calls.json
  AC-121:
    title: Material deletion and plan mutation reconciliation
    owners: [QA-API, MA, SO]
    gates: [G4, G5]
    tests:
      normal:
        - TestMutationReconciliation
        - TestMutationReconciliationSerializesSameAdvertiser
        - TestMarketingMutationAdapterUsesGeneratedServicesAndReadback
        - TestQianchuanWriteAdapterRejectsPartialMutation
    evidence: contracts/ac-121-mutations.json
  AC-122:
    title: Request rate-limit and performance budgets
    owners: [RL, QO]
    gates: [G3, G4, G5]
    tests:
      normal:
        - TestRequestBudgets
        - TestEveryCommandHasRequestBudgetProfile
        - TestLocalCommandFamiliesHaveZeroNetworkBudget
        - TestQianchuanBatchCommandsHaveUnboundedRequestCounter
    evidence: performance/ac-122-summary.json
    external_requirements:
      - id: benchmark-comparison
        kind: benchmark
        evidence: performance/ac-122-benchstat.json
  AC-123:
    title: Cancellation deadlines resources and data races
    owners: [RL, QO]
    gates: [G1, G3, G4, G5]
    tests:
      normal:
        - TestCancellationAndLeak
      race:
        - TestCancellationAndLeak
        - TestGovernorWaitIsCancelableAndReleasesPartialAcquisition
        - TestRetryPolicyPreservesCancellation
    evidence: performance/ac-123-race-and-leak.json
  AC-124:
    title: Five-platform binaries and Plugin launcher
    owners: [RO, QO]
    gates: [G5]
    tests:
      bootstrap:
        - TestEnsureValidThenOfflineCacheReuse
        - TestEnsureConcurrentLaunchesPromoteOnlyVerifiedAssets
        - TestDownloadAssetRejectsTruncationDigestAndCleansTemporaryFiles
    evidence: release/ac-124-platform-matrix.json
    required_evidence:
      - id: native-plugin-launcher
        kind: p5_acceptance
        evidence: release/ac-124-platform.json
        platform_bound: true
        required_values:
          offline_verified_cache: true
          invalid_asset_execution_count: 0
          system_go_required_by_plugin: false
          installed_ocean_watch_package_required: false
          go_env_verified: true
    external_requirements:
      - id: marketplace-native-install-matrix
        kind: native_platform_matrix
        evidence: release/ac-124-marketplace-install.json
        required_platforms: [darwin-arm64, darwin-amd64, linux-amd64, linux-arm64, windows-amd64]
  AC-125:
    title: Supply chain static analysis and reproducibility
    owners: [SO, RO]
    gates: [G0, G5]
    evidence: security/ac-125-supply-chain.json
    required_evidence:
      - id: signed-reproducible-release
        kind: p5_acceptance
        evidence: security/ac-125-supply-chain.json
        required_values:
          release_ready: true
          official_sdk: v1.1.92
          reproducible_asset_differences: []
    external_requirements:
      - id: approved-release-trust-root
        kind: protected_ci
        evidence: security/ac-125-release-trust-root.json
  AC-126:
    title: Upgrade cache and rollback state safety
    owners: [RO, AP, QO]
    gates: [G5]
    evidence: release/ac-126-upgrade-rollback.json
    required_evidence:
      - id: native-upgrade-rollback
        kind: p5_acceptance
        evidence: release/ac-126-upgrade-rollback.json
        platform_bound: true
        required_values:
          state_hash_unchanged: true
          reauthorization_count: 0
          damaged_cache_execution_count: 0
          rollback_under_15_minutes: true
    external_requirements:
      - id: previous-version-native-rollback
        kind: native_platform_matrix
        evidence: release/ac-126-previous-version-matrix.json
        required_platforms: [darwin-arm64, darwin-amd64, linux-amd64, linux-arm64, windows-amd64]
  AC-127:
    title: Real canary and stop drill
    owners: [MT, RO, SO, MA, QA-API]
    gates: [G4, G5]
    evidence: canary/ac-127-summary.json
    external_requirements:
      - id: read-and-write-canary
        kind: canary
        evidence: canary/ac-127-summary.json
        approvals: [MT, SO]
  AC-128:
    title: Documentation Skill and user upgrade experience
    owners: [SCO, RO, QO]
    gates: [G0, G5]
    evidence: contracts/ac-128-user-journeys.json
    required_evidence:
      - id: native-user-journeys
        kind: p5_acceptance
        evidence: contracts/ac-128-user-journeys.json
        platform_bound: true
        required_values:
          network_write_calls: 0
          state_hash_unchanged: true
    external_requirements:
      - id: full-skill-model-evaluation
        kind: model_eval
        evidence: contracts/ac-128-skill-eval.json
        minimum_trials: 3
      - id: marketplace-upgrade-journey
        kind: marketplace
        evidence: release/ac-128-marketplace-journey.json
      - id: rollout-observation-windows
        kind: rollout
        evidence: release/ac-128-rollout-observations.json
        required_cohorts: [internal, invited, general]
        minimum_released_versions: 2
