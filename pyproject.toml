[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-watch"
version = "1.0.9"
description = "Codex plugin for Ocean Engine advertising operations and monitoring"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "westng" }]
keywords = ["codex", "ocean-engine", "advertising", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/westng/ocean-watch"
Repository = "https://github.com/westng/ocean-watch"
Issues = "https://github.com/westng/ocean-watch/issues"
Changelog = "https://github.com/westng/ocean-watch/blob/main/CHANGELOG.md"
Releases = "https://github.com/westng/ocean-watch/releases"

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "PyYAML>=6,<7",
  "ruff>=0.11,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
ocean-watch = "ocean_watch.cli.main:main"

[tool.setuptools]
package-dir = { "" = "skills/ads-plan-monitor/src" }

[tool.setuptools.packages.find]
where = ["skills/ads-plan-monitor/src"]

[tool.setuptools.package-data]
"ocean_watch.resources" = ["*.json"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.9"
include = ["skills/ads-plan-monitor/src/ocean_watch"]
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["ocean_watch"]

[tool.coverage.report]
show_missing = true
skip_covered = true
