[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-watch"
version = "1.0.9"
description = "Codex plugin metadata and F2 dependency boundary for Ocean Engine operations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "westng" }]
keywords = ["codex", "ocean-engine", "advertising", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "f2==0.0.1.7",
  "socksio>=1,<2",
]

[project.urls]
Homepage = "https://github.com/westng/ocean-watch"
Repository = "https://github.com/westng/ocean-watch"
Issues = "https://github.com/westng/ocean-watch/issues"
Changelog = "https://github.com/westng/ocean-watch/blob/main/CHANGELOG.md"
Releases = "https://github.com/westng/ocean-watch/releases"

[project.optional-dependencies]
dev = [
  "PyYAML>=6,<7",
  "ruff>=0.11,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
